name: Обновление данных РФБ

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Скачать данные с сайта РФБ и обновить data.js
        run: python tools/update_data.py
      - name: Сохранить изменения, если они есть
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Обновление данных РФБ" && git push)
